<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Your TypeWell typing test results - view WPM, accuracy, key error heatmap, and download your performance report."
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/results.css" />
    <title>TypeWell — Results</title>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <img src="./assets/logo.png" alt="TypeWell" height="81" width="180" />
        </div>
        <a href="index.html" class="try-again-btn">
          <img src="./assets/icons/refreshIcon.svg" alt="Try Again" />
        </a>
      </nav>
    </header>

    <main id="results-main">
      <!-- Hero WPM -->
      <section id="hero-section">
        <div class="wpm-display-block">
          <span id="result-wpm" class="result-data"></span>
          <span class="wpm-label">Words per minute</span>
          <div class="mode-badge" id="result-mode"></div>
        </div>

        <!-- Stat Cards -->
        <section id="stats-section">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Accuracy</div>
              <div
                class="stat-info"
                data-tooltip="Percentage of correctly typed characters"
              >
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-accuracy"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Correct Chars</div>
              <div
                class="stat-info"
                data-tooltip="Total characters typed without error"
              >
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-correct"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Wrong Characters</div>
              <div
                class="stat-info"
                data-tooltip="Characters typed incorrectly"
              >
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-wrong"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Backspaces</div>
              <div
                class="stat-info"
                data-tooltip="Number of times you deleted a character"
              >
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-backspaces"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Total Keystrokes</div>
              <div
                class="stat-info"
                data-tooltip="Every key pressed including backspaces"
              >
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-keystrokes"></div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-label">Time</div>
              <div class="stat-info" data-tooltip="Total duration of the test">
                <img
                  src="./assets/icons/infoIcon.svg"
                  alt="info"
                  width="20"
                  height="20"
                />
              </div>
            </div>
            <div class="stat-value result-data" id="result-time"></div>
          </div>
        </section>
      </section>

      <div class="visual-row">
        <!-- WPM Graph -->
        <section id="graph-section">
          <div class="section-title">WPM over time</div>
          <canvas id="wpm-graph"></canvas>
        </section>

        <!-- Keyboard Heatmap -->
        <section id="heatmap-section">
          <div class="section-title">Key error heatmap</div>
          <div id="keyboard-heatmap"></div>
        </section>
      </div>

      <!-- History -->
      <section id="history-section">
        <div class="section-title">Last 5 results</div>
        <div id="history-list"></div>
      </section>

      <!-- Actions -->
      <section id="actions-section">
        <button id="btn-try-again" class="action-btn">
          <img
            src="./assets/icons/refreshIcon.svg"
            alt="try again"
            width="10"
            height="10"
          />
          <span>Try Again</span>
        </button>

        <button id="btn-drill" class="action-btn">
          <span>Drill Weak Keys</span>
        </button>

        <button id="btn-download" class="action-btn action-primary">
          <span>Download Report</span>
        </button>
      </section>
    </main>

    <footer>
      <span>TypeWell</span>
      <span>•</span>
      <span>Built for deliberate typing practice</span>
      <span>•</span>
      <span>Enjoy</span>
    </footer>
    <script type="module" src="./js/results.js"></script>
  </body>
</html>
